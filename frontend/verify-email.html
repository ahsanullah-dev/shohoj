<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Verify your email — Shohoj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Layered Ambient Background -->
  <div class="grain-bg"></div>
  <div class="blob-field">
    <div class="blob b1" data-speed="0.04"></div>
    <div class="blob b2" data-speed="-0.03"></div>
  </div>

  <nav id="nav"></nav>

  <div class="container-sm" style="padding-top:60px;padding-bottom:60px;">
    <div class="card reveal" style="padding:36px 32px;">
      <div class="eyebrow" style="margin-bottom:14px;"><span class="dot"></span> ONE LAST STEP</div>
      <h2 style="font-size:26px;margin-bottom:8px;">Verify your email</h2>
      <p class="muted" style="font-size:14px;margin-bottom:24px;line-height:1.5;">
        We sent a 6-digit code to <b id="emailDisplay">your email</b>. Enter it below to activate your account.
      </p>

      <form id="verifyForm">
        <div class="form-row">
          <label>Verification code</label>
          <input type="text" name="code" id="codeInput" required maxlength="6" inputmode="numeric"
                 pattern="[0-9]{6}" placeholder="123456"
                 style="letter-spacing:8px;font-size:22px;text-align:center;" />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px;">Verify Account</button>
      </form>

      <div style="border-top:1px solid var(--line);margin-top:24px;padding-top:18px;text-align:center;font-size:14px;" class="muted">
        Didn't get a code? <a href="#" id="resendLink" style="color:var(--amber);font-weight:600;">Resend it</a>
        &nbsp;·&nbsp;
        Wrong email? <a href="signup.html" style="color:var(--amber);font-weight:600;">Start over</a>
      </div>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNavbar();

    const params = new URLSearchParams(location.search);
    const email = params.get('email') || (API.currentUser() && API.currentUser().email) || '';
    const emailDisplay = document.getElementById('emailDisplay');
    emailDisplay.textContent = email || 'your email';

    const verifyForm = document.getElementById('verifyForm');
    const verifyBtn = verifyForm.querySelector('button[type="submit"]');

    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!email) {
        toast('No email found. Please start over from sign up.', 'error');
        return;
      }
      const code = document.getElementById('codeInput').value.trim();
      if (code.length !== 6) {
        toast('Please enter a valid 6-digit code.', 'error');
        return;
      }

      const origText = verifyBtn.textContent;
      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying...';

      try {
        const data = await API.post('/api/auth/verify-email', { email, code });
        if (data.token && data.user) {
          API.setSession(data.token, data.user);
        }
        toast('Email verified! Welcome to Shohoj.', 'success');
        setTimeout(() => (location.href = 'dashboard.html'), 400);
      } catch (err) {
        toast(err.message || 'Verification failed. Please check the code.', 'error');
        verifyBtn.disabled = false;
        verifyBtn.textContent = origText;
      }
    });

    const resendLink = document.getElementById('resendLink');
    resendLink.addEventListener('click', async (e) => {
      e.preventDefault();
      if (!email) {
        toast('No email found. Please start over from sign up.', 'error');
        return;
      }
      if (resendLink.dataset.loading === '1') return;
      resendLink.dataset.loading = '1';
      const origText = resendLink.textContent;
      resendLink.textContent = 'Sending...';

      try {
        await API.post('/api/auth/resend-verification', { email });
        toast('New code sent — check your inbox.', 'success');
      } catch (err) {
        toast(err.message || 'Could not resend code. Please wait a moment.', 'error');
      } finally {
        resendLink.dataset.loading = '0';
        resendLink.textContent = origText;
      }
    });
  </script>
</body>
</html>
