<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Feed — Shohoj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <div class="feed-header">
      <div>
        <h1 id="segTitle"></h1>
        <p class="muted" id="segTagline" style="margin:4px 0 0"></p>
      </div>
      <button class="btn btn-primary" id="newPostBtn"></button>
    </div>

    <!-- Feed Filters Bar -->
    <div class="feed-filters">
      <div style="position:relative; flex:1; min-width:200px;">
        <input type="search" id="q" placeholder="Search title, keywords, course codes..." style="padding-left:36px;" />
        <span style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted);" id="searchIconWrap"></span>
      </div>
      <select id="category"><option value="">All categories</option></select>
      <select id="postType"><option value="">All types</option></select>
      <label><input type="checkbox" id="ruetOnly" /> RUET verified only</label>
    </div>

    <!-- Feed Grid -->
    <div id="feed" class="post-grid"></div>
    <p id="empty" class="muted center hidden" style="padding:48px 0; font-size:16px;">
      ✨ No posts match your search filters in this segment. Be the first to post!
    </p>
  </div>

  <!-- ── New Post Modal with Real Image Upload ────────────────────────────── -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h2 id="modalTitle">Create New Post</h2>
      <form id="postForm">
        <div class="form-row">
          <label>Post Type</label>
          <select name="postType" id="fPostType" required></select>
        </div>
        <div class="form-row">
          <label>Category</label>
          <select name="category" id="fCategory"></select>
        </div>
        <div class="form-row">
          <label>Title</label>
          <input name="title" required maxlength="120" placeholder="e.g. Offering EEE 3201 Tuition — 3 days/week" />
        </div>
        <div class="form-row">
          <label>Description</label>
          <textarea name="description" placeholder="Add all necessary details, timing, requirements, etc..."></textarea>
        </div>

        <!-- Dynamic fields per segment -->
        <div id="dynFields"></div>

        <!-- Real Image Upload Dropzone -->
        <div class="form-row">
          <label>Real Photos (up to 6 images, JPG/PNG/WebP, max 10 MB each)</label>
          <div class="upload-dropzone" id="uploadDropzone">
            <input type="file" id="fImages" name="images" accept="image/*" multiple style="display:none;" />
            <div class="upload-dropzone-icon" id="dropzoneIcon"></div>
            <div class="upload-dropzone-title">Click to browse or drag &amp; drop photos here</div>
            <div class="upload-dropzone-sub">High resolution photos make your post 3x more attractive</div>
          </div>
          <div id="imgPreview" class="upload-preview-grid"></div>
        </div>

        <div class="form-row">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" name="isRuetOnly" /> Only show to RUET-verified students
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Publish Post</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    renderNavbar();

    // Populate icons
    document.getElementById('searchIconWrap').innerHTML = getIcon('search', 16);
    document.getElementById('newPostBtn').innerHTML = `${getIcon('plus', 16)} <span>New Post</span>`;
    document.getElementById('dropzoneIcon').innerHTML = getIcon('camera', 22);

    const params = new URLSearchParams(location.search);
    const segKey = params.get('segment') || 'tuition';
    const seg = getSegment(segKey);
    if (!seg) { location.href = 'dashboard.html'; }

    document.getElementById('segTitle').textContent = seg.icon + ' ' + seg.name;
    document.getElementById('segTagline').textContent = seg.tagline;
    document.title = seg.name + ' — Shohoj';

    // Populate filters
    const catSel = document.getElementById('category');
    seg.categories.forEach((c) => {
      const o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o);
    });
    const typeSel = document.getElementById('postType');
    seg.postTypes.forEach((t) => {
      const o = document.createElement('option'); o.value = t.key; o.textContent = t.label; typeSel.appendChild(o);
    });

    let searchTimer = null;

    async function loadFeed() {
      const feed = document.getElementById('feed');
      const empty = document.getElementById('empty');
      empty.classList.add('hidden');
      feed.innerHTML = getSkeletonCards(4);

      const q = document.getElementById('q').value.trim();
      const category = catSel.value;
      const postType = typeSel.value;
      const ruetOnly = document.getElementById('ruetOnly').checked ? '1' : '';
      const qs = new URLSearchParams({ segment: segKey });
      if (q) qs.set('q', q);
      if (category) qs.set('category', category);
      if (postType) qs.set('postType', postType);
      if (ruetOnly) qs.set('ruetOnly', ruetOnly);

      try {
        const { posts } = await API.get('/api/posts?' + qs.toString());
        renderFeed(posts);
      } catch (err) {
        feed.innerHTML = '';
        toast(err.message, 'error');
      }
    }

    function badgeFor(pt) {
      const cls = 'badge-' + pt;
      const label = seg.postTypes.find((t) => t.key === pt)?.label || pt;
      return '<span class="badge ' + cls + '">' + esc(label) + '</span>';
    }

    function renderFeed(posts) {
      const feed = document.getElementById('feed');
      const empty = document.getElementById('empty');
      if (!posts || !posts.length) {
        feed.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      feed.innerHTML = posts.map((p) => {
        const rawImg = (p.images && p.images[0] && p.images[0].url) || '';
        const img = resolveImgUrl(rawImg);
        const thumb = img
          ? `<div class="thumb" style="background-image:url('${esc(img)}')">
               <span class="thumb-badge">${seg.icon} ${esc(seg.name)}</span>
             </div>`
          : `<div class="thumb">
               ${seg.icon}
               <span class="thumb-badge">${esc(seg.name)}</span>
             </div>`;
        const price = p.price != null ? fmtBDT(p.price) + (p.priceNote ? ' · ' + esc(p.priceNote) : '') : 'Negotiable';

        return `<article class="post-card">
          ${thumb}
          <div class="body">
            <h3><a href="post.html?id=${p._id}">${esc(p.title)}</a></h3>
            <div class="meta">
              ${badgeFor(p.postType)}
              ${p.category ? '<span class="badge">' + esc(p.category) + '</span>' : ''}
              ${p.isRuetOnly ? '<span class="ruet-tag">RUET only</span>' : ''}
            </div>
            <div class="meta" style="margin-top:2px;">
              by <a href="profile.html?id=${p.author?._id}" style="font-weight:600; color:var(--text2);">${esc(p.author?.name || 'User')}</a>
              ${p.author?.isRuetVerified ? ' <span class="ruet-tag ruet-badge-sm">RUET</span>' : ''}
              · <span>${timeAgo(p.createdAt)}</span>
            </div>
            <div class="price-row">
              <div class="price">${price}</div>
              <a href="post.html?id=${p._id}" class="btn btn-sm" style="padding:4px 10px; font-size:12px;">View</a>
            </div>
          </div>
        </article>`;
      }).join('');
    }

    document.getElementById('q').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadFeed, 250);
    });
    ['category', 'postType', 'ruetOnly'].forEach((id) => {
      document.getElementById(id).addEventListener('change', loadFeed);
    });

    loadFeed();

    // ── New Post Modal Handling ──────────────────────────────────────────
    const modal = document.getElementById('modal');
    document.getElementById('newPostBtn').addEventListener('click', () => {
      if (!API.token()) {
        location.href = 'login.html?next=' + encodeURIComponent(location.pathname + location.search);
        return;
      }
      openModal();
    });
    document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.remove('show'));

    // Check if ?new=1 is in URL
    if (params.get('new') === '1') {
      if (API.token()) {
        openModal();
      } else {
        location.href = 'login.html?next=' + encodeURIComponent(location.pathname + location.search);
      }
    }

    function openModal() {
      // post types
      const pt = document.getElementById('fPostType');
      pt.innerHTML = seg.postTypes.map((t) => `<option value="${t.key}">${esc(t.label)}</option>`).join('');
      // categories
      const cat = document.getElementById('fCategory');
      cat.innerHTML = '<option value="">Uncategorized</option>' +
        seg.categories.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      // dynamic fields
      const dyn = document.getElementById('dynFields');
      const parts = [];
      if (seg.fields.includes('courseCode')) parts.push(field('Course Code', 'courseCode', 'text', 'e.g. EEE 3201 / MATH 1101'));
      if (seg.fields.includes('mode')) parts.push(select('Mode', 'mode', ['in-person', 'online', 'either']));
      if (seg.fields.includes('price')) parts.push(field('Price (BDT, optional)', 'price', 'number', 'e.g. 1500'));
      if (seg.fields.includes('deliveryTime')) parts.push(field('Delivery Time (optional)', 'deliveryTime', 'text', 'e.g. 2-3 days'));
      if (seg.fields.includes('condition')) parts.push(select('Item Condition', 'condition', ['', 'new', 'like new', 'used', 'for parts']));
      if (seg.fields.includes('urgency')) parts.push(select('Urgency', 'urgency', ['normal', 'urgent', 'flexible']));
      if (seg.fields.includes('location')) parts.push(field('Location / Hall (optional)', 'location', 'text', 'e.g. Shahid Abdul Muktadir Hall / Talaimari'));
      dyn.innerHTML = parts.join('');
      // reset uploaded images
      document.getElementById('fImages').value = '';
      document.getElementById('imgPreview').innerHTML = '';
      uploadedImages = [];
      document.getElementById('postForm').reset();
      modal.classList.add('show');
    }

    function field(label, name, type, ph) {
      return `<div class="form-row"><label>${esc(label)}</label><input type="${type}" name="${name}" placeholder="${esc(ph||'')}" /></div>`;
    }
    function select(label, name, opts) {
      return `<div class="form-row"><label>${esc(label)}</label><select name="${name}">
        ${opts.map((o) => `<option value="${esc(o)}">${esc(o || '— Select —')}</option>`).join('')}
      </select></div>`;
    }

    // ── Drag & Drop Real Image Upload Engine ──────────────────────────────
    let uploadedImages = [];
    const dropzone = document.getElementById('uploadDropzone');
    const fileInput = document.getElementById('fImages');

    dropzone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
      if (files.length) handleFiles(files);
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length) handleFiles(files);
    });

    async function handleFiles(files) {
      if (uploadedImages.length + files.length > 6) {
        toast('Maximum 6 images allowed per post', 'error');
        files = files.slice(0, 6 - uploadedImages.length);
      }
      if (!files.length) return;

      const fd = new FormData();
      files.forEach((f) => fd.append('images', f));

      try {
        toast(`Uploading ${files.length} real photo(s)...`, 'info');
        const { images } = await API.upload('/api/uploads/images', fd);
        uploadedImages = uploadedImages.concat(images).slice(0, 6);
        renderPreview();
        toast('Images uploaded successfully!', 'success');
      } catch (err) {
        toast('Upload failed: ' + err.message, 'error');
      } finally {
        fileInput.value = '';
      }
    }

    function renderPreview() {
      const previewEl = document.getElementById('imgPreview');
      previewEl.innerHTML = uploadedImages.map((img, i) => {
        const url = resolveImgUrl(img.url);
        return `
          <div class="upload-preview-item">
            <img src="${esc(url)}" alt="Post image ${i+1}" />
            <button type="button" data-i="${i}" class="upload-remove-btn" title="Remove image">✕</button>
          </div>
        `;
      }).join('');

      previewEl.querySelectorAll('.upload-remove-btn').forEach((b) =>
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          uploadedImages.splice(Number(e.currentTarget.dataset.i), 1);
          renderPreview();
        })
      );
    }

    // Form Submission
    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = {
        segment: segKey,
        title: fd.get('title'),
        description: fd.get('description'),
        category: fd.get('category') || '',
        postType: fd.get('postType') || 'offer',
        price: fd.get('price') ? Number(fd.get('price')) : null,
        courseCode: fd.get('courseCode') || '',
        mode: fd.get('mode') || '',
        deliveryTime: fd.get('deliveryTime') || '',
        condition: fd.get('condition') || '',
        urgency: fd.get('urgency') || '',
        location: fd.get('location') || '',
        isRuetOnly: !!fd.get('isRuetOnly'),
        images: uploadedImages,
      };
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Publishing…';
      try {
        await API.post('/api/posts', body);
        modal.classList.remove('show');
        toast('Post published successfully!', 'success');
        loadFeed();
      } catch (err) {
        toast(err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Publish Post';
      }
    });
  </script>
</body>
</html>
