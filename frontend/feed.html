<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Feed — Shohoj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <div class="feed-header">
      <div>
        <h1 id="segTitle"></h1>
        <p class="muted" id="segTagline" style="margin:4px 0 0"></p>
      </div>
      <button class="btn btn-primary" id="newPostBtn">+ New post</button>
    </div>

    <div class="feed-filters">
      <input type="search" id="q" placeholder="Search…" />
      <select id="category"><option value="">All categories</option></select>
      <select id="postType"><option value="">All types</option></select>
      <label><input type="checkbox" id="ruetOnly" /> RUET verified only</label>
    </div>

    <div id="feed" class="post-grid"></div>
    <p id="empty" class="muted center hidden" style="padding:40px 0">
      No posts yet in this segment. Be the first to post!
    </p>
  </div>

  <!-- New post modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h2 id="modalTitle">New post</h2>
      <form id="postForm">
        <div class="form-row">
          <label>Type</label>
          <select name="postType" id="fPostType" required></select>
        </div>
        <div class="form-row">
          <label>Category</label>
          <select name="category" id="fCategory"></select>
        </div>
        <div class="form-row">
          <label>Title</label>
          <input name="title" required maxlength="120" placeholder="e.g. Offering EEE 3201 tuition — small batch" />
        </div>
        <div class="form-row">
          <label>Description</label>
          <textarea name="description" placeholder="Add details, timing, requirements…"></textarea>
        </div>

        <!-- Dynamic fields per segment -->
        <div id="dynFields"></div>

        <div class="form-row">
          <label>Images (up to 6, JPG/PNG, max 5 MB each)</label>
          <input type="file" id="fImages" name="images" accept="image/*" multiple />
          <div class="form-hint">Uploaded to Cloudinary via the backend.</div>
          <div id="imgPreview" class="gallery mt-2"></div>
        </div>

        <div class="form-row">
          <label><input type="checkbox" name="isRuetOnly" /> Only show to RUET-verified users</label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Post</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    renderNavbar();

    const params = new URLSearchParams(location.search);
    const segKey = params.get('segment') || 'tuition';
    const seg = getSegment(segKey);
    if (!seg) { location.href = 'dashboard.html'; }

    document.getElementById('segTitle').textContent = seg.icon + ' ' + seg.name;
    document.getElementById('segTagline').textContent = seg.tagline;
    document.title = seg.name + ' — Shohoj';

    // Populate filters
    const catSel = document.getElementById('category');
    seg.categories.forEach((c) => {
      const o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o);
    });
    const typeSel = document.getElementById('postType');
    seg.postTypes.forEach((t) => {
      const o = document.createElement('option'); o.value = t.key; o.textContent = t.label; typeSel.appendChild(o);
    });

    async function loadFeed() {
      const q = document.getElementById('q').value.trim();
      const category = catSel.value;
      const postType = typeSel.value;
      const ruetOnly = document.getElementById('ruetOnly').checked ? '1' : '';
      const qs = new URLSearchParams({ segment: segKey });
      if (q) qs.set('q', q);
      if (category) qs.set('category', category);
      if (postType) qs.set('postType', postType);
      if (ruetOnly) qs.set('ruetOnly', ruetOnly);
      try {
        const { posts } = await API.get('/api/posts?' + qs.toString());
        renderFeed(posts);
      } catch (err) {
        toast(err.message, 'error');
      }
    }
    function badgeFor(pt) {
      const cls = 'badge-' + pt;
      const label = seg.postTypes.find((t) => t.key === pt)?.label || pt;
      return '<span class="badge ' + cls + '">' + esc(label) + '</span>';
    }
    function renderFeed(posts) {
      const feed = document.getElementById('feed');
      const empty = document.getElementById('empty');
      if (!posts.length) { feed.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      feed.innerHTML = posts.map((p) => {
        const rawImg = (p.images && p.images[0] && p.images[0].url) || '';
        const img = resolveImgUrl(rawImg);
        const thumb = img
          ? `<div class="thumb" style="background-image:url('${esc(img)}')"></div>`
          : `<div class="thumb">${seg.icon}</div>`;
        const price = p.price != null ? fmtBDT(p.price) + (p.priceNote ? ' · ' + esc(p.priceNote) : '') : '';
        return `<article class="post-card">
          ${thumb}
          <div class="body">
            <h3><a href="post.html?id=${p._id}">${esc(p.title)}</a></h3>
            <div class="meta">
              ${badgeFor(p.postType)}
              ${p.category ? '<span class="badge">' + esc(p.category) + '</span>' : ''}
              ${p.isRuetOnly ? '<span class="ruet-tag">RUET only</span>' : ''}
            </div>
            <div class="meta">
              by <a href="profile.html?id=${p.author?._id}">${esc(p.author?.name || 'user')}</a>
              ${p.author?.isRuetVerified ? ' <span class="ruet-tag">RUET</span>' : ''}
              · ${timeAgo(p.createdAt)}
            </div>
            <div class="price">${price}</div>
          </div>
        </article>`;
      }).join('');
    }

    ['q','category','postType','ruetOnly'].forEach((id) => {
      document.getElementById(id).addEventListener('input', loadFeed);
      document.getElementById(id).addEventListener('change', loadFeed);
    });

    loadFeed();

    // ---- New Post modal ----
    const modal = document.getElementById('modal');
    document.getElementById('newPostBtn').addEventListener('click', () => {
      if (!API.token()) { location.href = 'login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
      openModal();
    });
    document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.remove('show'));

    function openModal() {
      // post types
      const pt = document.getElementById('fPostType');
      pt.innerHTML = seg.postTypes.map((t) => `<option value="${t.key}">${esc(t.label)}</option>`).join('');
      // categories
      const cat = document.getElementById('fCategory');
      cat.innerHTML = '<option value="">Uncategorized</option>' +
        seg.categories.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      // dynamic fields
      const dyn = document.getElementById('dynFields');
      const parts = [];
      if (seg.fields.includes('courseCode')) parts.push(field('Course code', 'courseCode', 'text', 'e.g. EEE 3201'));
      if (seg.fields.includes('mode')) parts.push(select('Mode', 'mode', ['online', 'in-person', 'either']));
      if (seg.fields.includes('price')) parts.push(field('Price (BDT, optional)', 'price', 'number', 'e.g. 1500'));
      if (seg.fields.includes('deliveryTime')) parts.push(field('Delivery time (optional)', 'deliveryTime', 'text', 'e.g. 3 days'));
      if (seg.fields.includes('condition')) parts.push(select('Condition', 'condition', ['', 'new', 'like new', 'used', 'for parts']));
      if (seg.fields.includes('urgency')) parts.push(select('Urgency', 'urgency', ['low', 'normal', 'urgent']));
      if (seg.fields.includes('location')) parts.push(field('Location (optional)', 'location', 'text', 'e.g. Sher-e-Bangla Hall'));
      dyn.innerHTML = parts.join('');
      // reset images
      document.getElementById('fImages').value = '';
      document.getElementById('imgPreview').innerHTML = '';
      uploadedImages = [];
      document.getElementById('postForm').reset();
      modal.classList.add('show');
    }
    function field(label, name, type, ph) {
      return `<div class="form-row"><label>${esc(label)}</label><input type="${type}" name="${name}" placeholder="${esc(ph||'')}" /></div>`;
    }
    function select(label, name, opts) {
      return `<div class="form-row"><label>${esc(label)}</label><select name="${name}">
        ${opts.map((o) => `<option value="${esc(o)}">${esc(o || '—')}</option>`).join('')}
      </select></div>`;
    }

    // ---- Image upload ----
    let uploadedImages = [];
    document.getElementById('fImages').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const fd = new FormData();
      files.forEach((f) => fd.append('images', f));
      try {
        toast('Uploading ' + files.length + ' image(s)…');
        const { images } = await API.upload('/api/uploads/images', fd);
        uploadedImages = uploadedImages.concat(images).slice(0, 6);
        renderPreview();
        toast('Uploaded', 'success');
      } catch (err) {
        toast('Upload failed: ' + err.message, 'error');
      } finally {
        e.target.value = '';
      }
    });
    function renderPreview() {
      document.getElementById('imgPreview').innerHTML = uploadedImages.map((img, i) =>
        `<div style="position:relative">
           <img src="${esc(img.url)}" />
           <button type="button" data-i="${i}" class="btn btn-sm" style="position:absolute;top:4px;right:4px">✕</button>
         </div>`
      ).join('');
      document.querySelectorAll('#imgPreview button[data-i]').forEach((b) =>
        b.addEventListener('click', (e) => {
          uploadedImages.splice(Number(e.currentTarget.dataset.i), 1);
          renderPreview();
        })
      );
    }

    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = {
        segment: segKey,
        title: fd.get('title'),
        description: fd.get('description'),
        category: fd.get('category') || '',
        postType: fd.get('postType') || 'offer',
        price: fd.get('price') || null,
        courseCode: fd.get('courseCode') || '',
        mode: fd.get('mode') || '',
        deliveryTime: fd.get('deliveryTime') || '',
        condition: fd.get('condition') || '',
        urgency: fd.get('urgency') || '',
        location: fd.get('location') || '',
        isRuetOnly: !!fd.get('isRuetOnly'),
        images: uploadedImages,
      };
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Posting…';
      try {
        await API.post('/api/posts', body);
        modal.classList.remove('show');
        toast('Posted!', 'success');
        loadFeed();
      } catch (err) {
        toast(err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Post';
      }
    });
  </script>
</body>
</html>
