<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign up — Shohoj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Layered Ambient Background -->
  <div class="grain-bg"></div>
  <div class="blob-field">
    <div class="blob b1" data-speed="0.04"></div>
    <div class="blob b2" data-speed="-0.03"></div>
  </div>

  <nav id="nav"></nav>

  <div class="container-sm" style="padding-top:50px;padding-bottom:60px;">
    <div class="card reveal" style="padding:36px 32px;">
      <div class="eyebrow" style="margin-bottom:14px;"><span class="dot"></span> JOIN SHOHOJ</div>
      <h2 style="font-size:26px;margin-bottom:8px;">Create your student account</h2>
      <p class="muted" style="font-size:14px;margin-bottom:24px;line-height:1.5;">
        Open to everyone. Use an <b>@student.ruet.ac.bd</b> or <b>@ruet.ac.bd</b> email to automatically receive a <span class="ruet-tag">RUET VERIFIED</span> badge.
      </p>

      <form id="signupForm">
        <div class="form-row">
          <label>Full Name</label>
          <input type="text" name="name" required placeholder="e.g. Fahim Rahman" />
        </div>
        <div class="form-row">
          <label>Email Address</label>
          <input type="email" name="email" required autocomplete="email" id="emailInput" placeholder="name@student.ruet.ac.bd or email" />
          <div class="form-hint" id="ruetHint" style="margin-top:6px;"></div>
        </div>
        <div class="form-row">
          <label>Password (minimum 6 characters)</label>
          <input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px;">Create Account</button>
      </form>

      <div style="border-top:1px solid var(--line);margin-top:24px;padding-top:18px;text-align:center;font-size:14px;" class="muted">
        Already have an account? <a href="login.html" style="color:var(--amber);font-weight:600;">Log in</a>
      </div>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNavbar();
    const RUET_DOMAINS = ['student.ruet.ac.bd', 'ruet.ac.bd'];
    const emailInput = document.getElementById('emailInput');
    const hint = document.getElementById('ruetHint');

    emailInput.addEventListener('input', () => {
      const v = emailInput.value.toLowerCase();
      if (RUET_DOMAINS.some((d) => v.endsWith('@' + d))) {
        hint.innerHTML = '✨ <span style="color:var(--teal);font-weight:600;">RUET email detected!</span> You will get an automatic <span class="ruet-tag">RUET</span> verified trust tag.';
      } else {
        hint.textContent = '';
      }
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const { token, user } = await API.post('/api/auth/register', {
          name: fd.get('name'),
          email: fd.get('email'),
          password: fd.get('password'),
        });
        API.setSession(token, user);
        toast('Welcome to Shohoj!', 'success');
        setTimeout(() => (location.href = 'dashboard.html'), 400);
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
