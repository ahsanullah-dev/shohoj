<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dashboard — Shohoj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Layered Ambient Background -->
  <div class="grain-bg"></div>
  <div class="blob-field">
    <div class="blob b1" data-speed="0.04"></div>
    <div class="blob b2" data-speed="-0.03"></div>
  </div>

  <nav id="nav"></nav>

  <div class="wrap" style="padding-top:40px;padding-bottom:60px;">
    <div class="section-head reveal">
      <div class="eyebrow" style="color:var(--amber);background:var(--amber-dim);border-color:rgba(255,176,32,.3);">
        <span class="dot" style="background:var(--amber);"></span> CAMPUS SEGMENTS
      </div>
      <h2>Choose your marketplace segment</h2>
      <p>Each segment has its own dedicated feed, tailored category filters, and verified student listings.</p>
    </div>

    <div class="segment-grid" id="segments"></div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    renderNavbar();

    const segAccents = {
      tuition: { color: 'var(--amber)', dim: 'var(--amber-dim)' },
      tech: { color: 'var(--teal)', dim: 'var(--teal-dim)' },
      creative: { color: 'var(--violet)', dim: 'var(--violet-dim)' },
      errands: { color: 'var(--rose)', dim: 'var(--rose-dim)' },
      marketplace: { color: 'var(--blue)', dim: 'var(--blue-dim)' },
    };

    document.getElementById('segments').innerHTML = SEGMENTS.map((s) => {
      const acc = segAccents[s.key] || { color: 'var(--amber)', dim: 'var(--amber-dim)' };
      return `
        <a class="segment-card reveal" href="feed.html?segment=${s.key}" style="--accent:${acc.color};--accent-dim:${acc.dim};min-height:220px;">
          <div>
            <div class="icon">${s.icon}</div>
            <h3>${esc(s.name)}</h3>
            <p>${esc(s.tagline)}</p>
          </div>
          <div style="margin-top:20px;display:flex;justify-content:space-between;align-items:center;">
            <span class="mono" style="font-size:12px;color:${acc.color};">Explore feed →</span>
          </div>
        </a>
      `;
    }).join('');

    // 3D Tilt on segment cards
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('.segment-card').forEach((card) => {
      card.addEventListener('mousemove', (e) => {
        if (reduceMotion) return;
        const r = card.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        const rx = ((y / r.height) - 0.5) * -10;
        const ry = ((x / r.width) - 0.5) * 10;
        card.style.transform = `perspective(600px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px)`;
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(600px) rotateX(0) rotateY(0)';
      });
    });
  </script>
</body>
</html>
