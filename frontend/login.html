<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Log in — Shohoj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Layered Ambient Background -->
  <div class="grain-bg"></div>
  <div class="blob-field">
    <div class="blob b1" data-speed="0.04"></div>
    <div class="blob b2" data-speed="-0.03"></div>
  </div>

  <nav id="nav"></nav>

  <div class="container-sm" style="padding-top:60px;padding-bottom:60px;">
    <div class="card reveal" style="padding:36px 32px;">
      <div class="eyebrow" style="margin-bottom:14px;"><span class="dot"></span> WELCOME BACK</div>
      <h2 style="font-size:26px;margin-bottom:8px;">Log in to Shohoj</h2>
      <p class="muted" style="font-size:14px;margin-bottom:24px;">Access your student messages, active listings, and payment verifications.</p>

      <form id="loginForm">
        <div class="form-row">
          <label>Campus Email</label>
          <input type="email" name="email" required autocomplete="email" placeholder="name@student.ruet.ac.bd or gmail" />
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px;">Log In</button>
      </form>

      <div style="display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted, #888);font-size:13px;">
        <div style="flex:1;height:1px;background:var(--line);"></div>
        OR
        <div style="flex:1;height:1px;background:var(--line);"></div>
      </div>

      <div id="googleBtn" style="display:flex;justify-content:center;"></div>

      <div style="border-top:1px solid var(--line);margin-top:24px;padding-top:18px;text-align:center;font-size:14px;" class="muted">
        Don't have an account? <a href="signup.html" style="color:var(--amber);font-weight:600;">Sign up free</a>
      </div>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    renderNavbar();

    window.onload = () => {
      if (!window.google || !window.SHOHOJ_GOOGLE_CLIENT_ID) return;
      google.accounts.id.initialize({
        client_id: window.SHOHOJ_GOOGLE_CLIENT_ID,
        callback: async (response) => {
          try {
            const { token, user } = await API.post('/api/auth/google', { idToken: response.credential });
            API.setSession(token, user);
            toast(`Welcome back, ${user.name}!`, 'success');
            const params = new URLSearchParams(location.search);
            setTimeout(() => (location.href = params.get('next') || 'dashboard.html'), 400);
          } catch (err) {
            toast(err.message, 'error');
          }
        },
      });
      google.accounts.id.renderButton(document.getElementById('googleBtn'), {
        theme: 'outline', size: 'large', width: 280, text: 'signin_with',
      });
    };
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const { token, user } = await API.post('/api/auth/login', {
          email: fd.get('email'),
          password: fd.get('password'),
        });
        API.setSession(token, user);
        toast(`Welcome back, ${user.name}!`, 'success');
        const params = new URLSearchParams(location.search);
        setTimeout(() => {
          location.href = params.get('next') || 'dashboard.html';
        }, 400);
      } catch (err) {
        if (/verify your email/i.test(err.message)) {
          toast('Please verify your email first — redirecting…', 'error');
          setTimeout(() => {
            location.href = 'verify-email.html?email=' + encodeURIComponent(fd.get('email'));
          }, 600);
        } else {
          toast(err.message, 'error');
        }
      }
    });
  </script>
</body>
</html>
