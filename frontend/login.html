<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Log in — Shohoj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="container-sm">
    <div class="card" style="box-shadow:var(--shadow-lg);">
      <div style="text-align:center; margin-bottom:24px;">
        <h2 style="margin:0 0 6px; font-size:24px;">Welcome Back</h2>
        <p class="muted" style="margin:0; font-size:14px;">Sign in to your Shohoj account to manage your listings and messages</p>
      </div>
      <form id="loginForm">
        <div class="form-row">
          <label>Email Address</label>
          <input type="email" name="email" required autocomplete="email" placeholder="name@student.ruet.ac.bd" />
        </div>
        <div class="form-row">
          <label>Password</label>
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" type="submit" id="loginBtn" style="width:100%; padding:12px; margin-top:8px;">
          Log In
        </button>
      </form>
      <div style="text-align:center; margin-top:20px; padding-top:16px; border-top:1px solid var(--border);" class="muted">
        No account yet? <a href="signup.html" style="font-weight:700;">Sign up for free</a>
      </div>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNavbar();
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      const fd = new FormData(e.target);
      try {
        const { token, user } = await API.post('/api/auth/login', {
          email: fd.get('email'),
          password: fd.get('password'),
        });
        API.setSession(token, user);
        toast('Logged in successfully', 'success');
        const params = new URLSearchParams(location.search);
        setTimeout(() => {
          location.href = params.get('next') || 'dashboard.html';
        }, 300);
      } catch (err) {
        toast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
