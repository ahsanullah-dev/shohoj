<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Profile — Shohoj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <div id="wrap"></div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/features.js"></script>
  <script>
    renderNavbar();
    const id = new URLSearchParams(location.search).get('id');
    let profileUser = null;
    (async () => {
      try {
        const { user, posts, rating } = await API.get('/api/users/' + id);
        profileUser = user;
        render(user, posts, rating);
        loadProfileReviews(id);
      } catch {
        document.getElementById('wrap').innerHTML = '<div class="card">User not found.</div>';
      }
    })();

    function render(u, posts, rating) {
      const me = API.currentUser();
      const isMe = me && me._id === u._id;
      const avatarUrl = resolveImgUrl(u.avatarUrl);
      rating = rating || { avg: 0, count: 0 };

      document.getElementById('wrap').innerHTML = `
        <div class="card">
          <div class="profile-header">
            <div class="avatar-upload-wrap">
              <div class="avatar" id="profileAvatar" style="${avatarUrl ? "background-image:url('"+esc(avatarUrl)+"')" : ''}">
                ${avatarUrl ? '' : (u.name?.[0]||'U').toUpperCase()}
              </div>
              ${isMe ? `
                <button type="button" class="avatar-camera-btn" id="avatarUploadBtn" title="Upload avatar">
                  📷
                </button>
                <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" />
              ` : ''}
            </div>
            <div style="flex:1">
              <h2 style="margin:0">${esc(u.name)} ${u.isRuetVerified ? '<span class="ruet-tag">RUET</span>' : ''} ${u.isBanned ? '<span class="badge status-sold">Banned</span>' : ''}</h2>
              <div class="muted">${[u.department, u.batch, u.hall].filter(Boolean).map(esc).join(' · ') || 'No profile details yet'}</div>
              <div class="rating-summary" style="margin-top:4px">
                ${starHtml(rating.avg, 16)} <b style="font-size:14px">${rating.avg ? rating.avg.toFixed(1) : '—'}</b>
                <span class="muted" style="font-size:12px">${rating.count} review${rating.count === 1 ? '' : 's'}</span>
              </div>
              <div class="muted" style="font-size:13px">Joined ${new Date(u.createdAt).toLocaleDateString()}</div>
            </div>
            ${isMe ? '<button class="btn" id="editBtn">Edit profile</button>' :
              `<div class="flex gap-2" style="flex-wrap:wrap">
                 <button class="btn btn-primary" id="msgBtn">💬 Message</button>
                 <button class="btn" id="reportUserBtn">🚩 Report</button>
                 <button class="btn" id="blockBtn">Block user</button>
               </div>`}
          </div>
          ${u.bio ? '<p>'+esc(u.bio)+'</p>' : ''}
        </div>

        <div class="reviews-section">
          <h3 style="margin:0 0 12px">Reviews</h3>
          <div id="profileReviews"><p class="muted">Loading reviews…</p></div>
        </div>

        ${isMe ? `
        <div class="card mt-3 hidden" id="editCard">
          <h3>Edit profile</h3>
          <form id="editForm">
            <div class="form-row"><label>Name</label><input name="name" value="${esc(u.name)}" required /></div>
            <div class="form-row"><label>Department</label><input name="department" value="${esc(u.department)}" placeholder="CSE" /></div>
            <div class="form-row"><label>Batch</label><input name="batch" value="${esc(u.batch)}" placeholder="2021" /></div>
            <div class="form-row"><label>Hall</label><input name="hall" value="${esc(u.hall)}" placeholder="Sher-e-Bangla Hall" /></div>
            <div class="form-row"><label>Bio</label><textarea name="bio">${esc(u.bio)}</textarea></div>
            <div class="form-row"><label>bKash number (for receiving payments)</label><input name="bkashNumber" value="${esc(u.bkashNumber || '')}" placeholder="017XXXXXXXX" /></div>
            <div class="form-row"><label>Nagad number (for receiving payments)</label><input name="nagadNumber" value="${esc(u.nagadNumber || '')}" placeholder="017XXXXXXXX" /></div>
            <button class="btn btn-primary" type="submit">Save</button>
          </form>
        </div>` : ''}

        <h3 class="mt-3">Active posts (${posts.length})</h3>
        <div class="post-grid">
          ${posts.length === 0 ? '<p class="muted">No active posts.</p>' :
            posts.map(p => {
              const seg = getSegment(p.segment);
              const rawImg = p.images?.[0]?.url;
              const img = resolveImgUrl(rawImg);
              const thumb = img ? `<div class="thumb" style="background-image:url('${esc(img)}')"></div>` : `<div class="thumb">${seg?.icon||''}</div>`;
              return `<article class="post-card">${thumb}
                <div class="body">
                  <h3><a href="post.html?id=${p._id}">${esc(p.title)}</a></h3>
                  <div class="meta"><span class="badge">${esc(seg?.name || p.segment)}</span></div>
                  <div class="price">${p.price != null ? fmtBDT(p.price) : ''}</div>
                </div></article>`;
            }).join('')}
        </div>
      `;

      if (isMe) {
        const camBtn = document.getElementById('avatarUploadBtn');
        const fileInput = document.getElementById('avatarFileInput');
        if (camBtn && fileInput) {
          camBtn.addEventListener('click', () => fileInput.click());
          fileInput.addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('avatar', file);
            try {
              toast('Uploading avatar…', 'info');
              const { image } = await API.upload('/api/uploads/avatar', fd);
              const { user: updatedUser } = await API.patch('/api/users/me', { avatarUrl: image.url });
              API.setSession(null, updatedUser);
              renderNavbar();
              const avatarEl = document.getElementById('profileAvatar');
              if (avatarEl) {
                const fullUrl = resolveImgUrl(image.url);
                avatarEl.style.backgroundImage = `url('${esc(fullUrl)}')`;
                avatarEl.textContent = '';
              }
              toast('Avatar updated', 'success');
            } catch (err) {
              toast('Avatar upload failed: ' + err.message, 'error');
            } finally {
              fileInput.value = '';
            }
          });
        }
      }

      const editBtn = document.getElementById('editBtn');
      if (editBtn) editBtn.addEventListener('click', () => document.getElementById('editCard').classList.toggle('hidden'));

      const editForm = document.getElementById('editForm');
      if (editForm) editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = {};
        for (const [k, v] of fd.entries()) body[k] = v;
        try {
          const { user } = await API.patch('/api/users/me', body);
          API.setSession(null, user);
          toast('Saved', 'success');
          setTimeout(() => location.reload(), 400);
        } catch (err) { toast(err.message, 'error'); }
      });

      const msgBtn = document.getElementById('msgBtn');
      if (msgBtn) msgBtn.addEventListener('click', async () => {
        if (!API.token()) { location.href = 'login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
        try {
          const { conversation } = await API.post('/api/messages/conversations', { recipientId: u._id });
          location.href = 'inbox.html?c=' + conversation._id;
        } catch (err) { toast(err.message, 'error'); }
      });

      const reportUserBtn = document.getElementById('reportUserBtn');
      if (reportUserBtn) reportUserBtn.addEventListener('click', () => openReportModal('user', u._id, u.name));

      const blockBtn = document.getElementById('blockBtn');
      if (blockBtn) blockBtn.addEventListener('click', () => toggleBlock(u._id, blockBtn));
    }

    async function loadProfileReviews(userId) {
      try {
        const { reviews, rating } = await API.get('/api/reviews/user/' + userId);
        const el = document.getElementById('profileReviews');
        if (!reviews.length) { el.innerHTML = '<p class="muted">No reviews yet.</p>'; return; }
        el.innerHTML = reviews.map((r) => {
          const av = resolveImgUrl(r.reviewer?.avatarUrl);
          return `<div class="review-item">
            <div class="review-head">
              <div class="avatar" style="${av ? "background-image:url('"+esc(av)+"')" : ''}">${av ? '' : esc(r.reviewer?.name?.[0] || 'U')}</div>
              <div>
                <div><b>${esc(r.reviewer?.name || 'user')}</b> ${r.reviewer?.isRuetVerified ? '<span class="ruet-tag">RUET</span>' : ''}</div>
                <div>${starHtml(r.rating, 13)} <span class="muted" style="font-size:11px">· ${timeAgo(r.createdAt)}</span></div>
              </div>
            </div>
            ${r.comment ? '<div class="review-comment">' + esc(r.comment) + '</div>' : ''}
          </div>`;
        }).join('');
      } catch (_) {
        const el = document.getElementById('profileReviews');
        if (el) el.innerHTML = '<p class="muted">Could not load reviews.</p>';
      }
    }
  </script>
</body>
</html>
