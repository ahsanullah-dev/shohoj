<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Post Details — Shohoj</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>
  <div class="container">
    <div id="postWrap">
      <div class="card" style="padding:48px; text-align:center;">
        <p class="muted">Loading post details...</p>
      </div>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    renderNavbar();
    const id = new URLSearchParams(location.search).get('id');

    (async () => {
      try {
        const { post } = await API.get('/api/posts/' + id);
        render(post);
      } catch (err) {
        document.getElementById('postWrap').innerHTML = `
          <div class="card" style="text-align:center; padding:56px 24px;">
            <h2 style="margin-bottom:8px;">Post not found</h2>
            <p class="muted">This post may have been removed or is no longer available.</p>
            <a href="index.html" class="btn btn-primary mt-2">← Back to Marketplace</a>
          </div>
        `;
      }
    })();

    function render(p) {
      const seg = getSegment(p.segment);
      const me = API.currentUser();
      const isMine = me && p.author && me._id === p.author._id;

      // Images Gallery
      let galleryHtml = '';
      if (p.images && p.images.length > 0) {
        const primaryImg = resolveImgUrl(p.images[0].url);
        const thumbsHtml = p.images.map((imgObj, idx) => {
          const u = resolveImgUrl(imgObj.url);
          return `
            <div class="post-gallery-thumb ${idx === 0 ? 'active' : ''}" data-url="${esc(u)}">
              <img src="${esc(u)}" alt="Thumbnail ${idx+1}" />
            </div>
          `;
        }).join('');

        galleryHtml = `
          <div class="post-gallery">
            <div class="post-gallery-main">
              <img id="mainGalleryImg" src="${esc(primaryImg)}" alt="${esc(p.title)}" />
            </div>
            ${p.images.length > 1 ? `<div class="post-gallery-thumbs" id="galleryThumbs">${thumbsHtml}</div>` : ''}
          </div>
        `;
      }

      const fields = [];
      if (p.courseCode) fields.push(['Course Code', p.courseCode, 'tag']);
      if (p.mode) fields.push(['Service Mode', p.mode, 'sparkles']);
      if (p.condition) fields.push(['Item Condition', p.condition, 'check']);
      if (p.urgency) fields.push(['Urgency', p.urgency, 'clock']);
      if (p.deliveryTime) fields.push(['Delivery Time', p.deliveryTime, 'clock']);
      if (p.location) fields.push(['Location', p.location, 'compass']);

      const authorAvatar = resolveImgUrl(p.author?.avatarUrl);

      document.getElementById('postWrap').innerHTML = `
        <div class="post-detail">
          <!-- Main Post Body -->
          <div class="card">
            <div class="muted" style="font-size:13.5px; margin-bottom:10px; display:flex; align-items:center; gap:8px;">
              <a href="feed.html?segment=${p.segment}" style="font-weight:700; display:inline-flex; align-items:center; gap:5px;">
                ${seg?.icon || '📋'} ${esc(seg?.name || '')}
              </a>
              <span>·</span>
              <span>${timeAgo(p.createdAt)}</span>
              ${p.isRuetOnly ? '<span>·</span> <span class="ruet-tag">RUET only</span>' : ''}
            </div>

            <h1 style="margin:0 0 12px; font-size:26px; line-height:1.3;">${esc(p.title)}</h1>

            <div style="margin-bottom:20px; display:flex; gap:6px; flex-wrap:wrap;">
              <span class="badge badge-${p.postType}">${esc(seg?.postTypes.find(t=>t.key===p.postType)?.label || p.postType)}</span>
              ${p.category ? '<span class="badge">'+esc(p.category)+'</span>' : ''}
            </div>

            ${galleryHtml}

            <div style="margin-top:16px;">
              <h3 style="font-size:16px; margin-bottom:8px;">Description</h3>
              ${p.description ? `<p style="white-space:pre-wrap; line-height:1.7; color:var(--text2);">${esc(p.description)}</p>` : '<p class="muted">No description provided.</p>'}
            </div>

            ${fields.length ? `
              <div style="margin-top:24px; padding-top:18px; border-top:1px solid var(--border);">
                <h3 style="font-size:16px; margin-bottom:12px;">Key Details</h3>
                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
                  ${fields.map(([k, v, iconName]) => `
                    <div style="background:var(--bg2); padding:10px 14px; border-radius:10px; border:1px solid var(--border);">
                      <div class="muted" style="font-size:12px; font-weight:600;">${esc(k)}</div>
                      <div style="font-weight:700; font-size:14.5px; margin-top:2px;">${esc(v)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            ${isMine ? `
              <div class="mt-3" style="padding-top:18px; border-top:1px solid var(--border); display:flex; justify-content:flex-end;">
                <button class="btn btn-danger" id="delBtn">
                  ${getIcon('trash', 16)} <span>Delete Post</span>
                </button>
              </div>
            ` : ''}
          </div>

          <!-- Sidebar: Price & Seller Card -->
          <div>
            <div class="card" style="position:sticky; top:80px;">
              <div style="font-size:26px; font-weight:800; color:var(--primary); margin-bottom:6px;">
                ${p.price != null ? fmtBDT(p.price) : 'Price on request'}
              </div>
              ${p.priceNote ? `<div class="muted" style="font-size:13px; margin-bottom:14px;">${esc(p.priceNote)}</div>` : '<div style="margin-bottom:14px;"></div>'}

              <div style="border-top:1px solid var(--border); padding-top:16px; margin-top:8px;">
                <div style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:10px;">Posted By</div>
                <a href="profile.html?id=${p.author?._id}" style="display:flex; align-items:center; gap:14px; color:var(--text);">
                  <div class="avatar" style="width:52px; height:52px; font-size:20px; ${authorAvatar ? `background-image:url('${esc(authorAvatar)}');` : ''}">
                    ${authorAvatar ? '' : (p.author?.name?.[0] || 'U').toUpperCase()}
                  </div>
                  <div>
                    <div style="font-weight:700; font-size:15px;">
                      ${esc(p.author?.name || 'User')}
                      ${p.author?.isRuetVerified ? '<span class="ruet-tag" style="margin-left:4px;">RUET</span>' : ''}
                    </div>
                    <div class="muted" style="font-size:12.5px; margin-top:2px;">
                      ${[p.author?.department, p.author?.batch, p.author?.hall].filter(Boolean).map(esc).join(' · ') || 'RUET Student'}
                    </div>
                  </div>
                </a>

                ${p.author?.bio ? `<p class="muted" style="margin-top:12px; font-size:13.5px; line-height:1.5;">${esc(p.author.bio)}</p>` : ''}
              </div>

              <div style="margin-top:20px;">
                ${!isMine ? `
                  <button class="btn btn-primary" id="msgBtn" style="width:100%; padding:12px;">
                    ${getIcon('chat', 18)} <span>Send Direct Message</span>
                  </button>
                ` : `
                  <div class="stat-pill" style="justify-content:center; width:100%;">
                    <span>📌</span> This is your active listing
                  </div>
                `}
              </div>
            </div>
          </div>
        </div>
      `;

      // Gallery thumbnail click interaction
      const thumbs = document.querySelectorAll('#galleryThumbs .post-gallery-thumb');
      const mainImg = document.getElementById('mainGalleryImg');
      thumbs.forEach((th) => {
        th.addEventListener('click', () => {
          thumbs.forEach(t => t.classList.remove('active'));
          th.classList.add('active');
          if (mainImg) {
            mainImg.src = th.dataset.url;
          }
        });
      });

      if (mainImg) {
        mainImg.addEventListener('click', () => {
          window.open(mainImg.src, '_blank');
        });
      }

      // Delete post button
      const del = document.getElementById('delBtn');
      if (del) {
        del.addEventListener('click', async () => {
          if (!confirm('Are you sure you want to permanently delete this post?')) return;
          try {
            await API.del('/api/posts/' + p._id);
            toast('Post deleted', 'info');
            setTimeout(() => { location.href = 'feed.html?segment=' + p.segment; }, 400);
          } catch (err) {
            toast(err.message, 'error');
          }
        });
      }

      // Message button
      const msg = document.getElementById('msgBtn');
      if (msg) {
        msg.addEventListener('click', async () => {
          if (!API.token()) {
            location.href = 'login.html?next=' + encodeURIComponent(location.pathname + location.search);
            return;
          }
          try {
            const { conversation } = await API.post('/api/messages/conversations', {
              recipientId: p.author._id,
              postId: p._id,
            });
            location.href = 'inbox.html?c=' + conversation._id;
          } catch (err) {
            toast(err.message, 'error');
          }
        });
      }
    }
  </script>
</body>
</html>
