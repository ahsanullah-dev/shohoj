<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shohoj — Dynamic Student Services Marketplace</title>
  <meta name="description" content="Shohoj is the all-in-one student services marketplace — tuition, tech repair, creative gigs, campus errands, and buy & sell, all in one place." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>

  <!-- ── Dynamic Hero Section ─────────────────────────────────────────────── -->
  <div class="hero-compact">
    <div class="hero-badge-pill">
      <span class="dot"></span>
      <span>RUET Verified Campus Marketplace</span>
    </div>
    <h1>Connect, Trade &amp; Thrive On Campus</h1>
    <p>
      Tuition, tech repair, creative gigs, campus errands, buy &amp; sell — zero scam, verified peers.
    </p>

    <!-- Live Search Bar -->
    <div class="hero-search-wrap">
      <span class="hero-search-icon" id="heroSearchIcon"></span>
      <input type="search" id="homeSearchInput" class="hero-search-input" placeholder="Search posts, services, course codes (e.g. CSE, Calculus, Laptop)..." />
    </div>

    <!-- Quick Action Buttons -->
    <div class="flex gap-3" style="justify-content:center; flex-wrap:wrap;">
      <a href="feed.html?new=1" class="btn btn-primary" id="heroPostBtn"></a>
      <a href="dashboard.html" class="btn" id="heroBrowseBtn"></a>
    </div>

    <!-- Live Stats Strip -->
    <div class="hero-stats-strip">
      <div class="stat-pill">
        <span>🛡️</span> <b>RUET Verified</b>
      </div>
      <div class="stat-pill">
        <span>💳</span> <b>Escrow Payments</b>
      </div>
      <div class="stat-pill">
        <span>⚡</span> <b>Direct Student Chat</b>
      </div>
    </div>
  </div>

  <!-- ── Segment pills + feed ─────────────────────────────────────────────── -->
  <div class="container">
    <!-- Segment pill strip -->
    <div class="segment-pills" id="segmentPills" role="tablist" aria-label="Filter by segment"></div>

    <!-- Unified feed -->
    <div class="home-feed-section">
      <div id="homeFeed" class="post-grid"></div>
      <p id="homeFeedEmpty" class="muted center hidden" style="padding:56px 0; font-size:16px;">
        🔍 No matching posts found. Be the first to post in this category!
      </p>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    renderNavbar();

    // Populate hero icons and buttons
    document.getElementById('heroSearchIcon').innerHTML = getIcon('search', 18);
    document.getElementById('heroPostBtn').innerHTML = `${getIcon('plus', 16)} <span>Post an Ad</span>`;
    document.getElementById('heroBrowseBtn').innerHTML = `${getIcon('compass', 16)} <span>All Segments</span>`;

    // ── Segment pills ────────────────────────────────────────────────────
    let activeSegment = ''; // '' = all
    let searchQuery = '';
    let searchDebounce = null;

    const pillsEl = document.getElementById('segmentPills');

    // "All" pill
    const allPill = document.createElement('button');
    allPill.className = 'seg-pill active';
    allPill.dataset.key = '';
    allPill.setAttribute('role', 'tab');
    allPill.setAttribute('aria-selected', 'true');
    allPill.innerHTML = '<span class="pill-icon">✨</span> All';
    allPill.addEventListener('click', () => setSegment(''));
    pillsEl.appendChild(allPill);

    SEGMENTS.forEach((s) => {
      const pill = document.createElement('button');
      pill.className = 'seg-pill';
      pill.dataset.key = s.key;
      pill.setAttribute('role', 'tab');
      pill.setAttribute('aria-selected', 'false');
      pill.innerHTML = `<span class="pill-icon">${s.icon}</span> ${esc(s.name)}`;
      pill.addEventListener('click', () => setSegment(s.key));
      pillsEl.appendChild(pill);
    });

    function setSegment(key) {
      activeSegment = key;
      // update active pill
      pillsEl.querySelectorAll('.seg-pill').forEach((p) => {
        const isActive = p.dataset.key === key;
        p.classList.toggle('active', isActive);
        p.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });
      loadHomeFeed();
    }

    // ── Live Search Input ────────────────────────────────────────────────
    const searchInput = document.getElementById('homeSearchInput');
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchQuery = e.target.value.trim();
      searchDebounce = setTimeout(loadHomeFeed, 250);
    });

    // ── Unified Feed with Skeleton Loader ─────────────────────────────────
    async function loadHomeFeed() {
      const feedEl = document.getElementById('homeFeed');
      const emptyEl = document.getElementById('homeFeedEmpty');

      emptyEl.classList.add('hidden');
      feedEl.innerHTML = getSkeletonCards(6);

      try {
        const qs = new URLSearchParams({ limit: 30 });
        if (activeSegment) qs.set('segment', activeSegment);
        if (searchQuery) qs.set('q', searchQuery);

        const { posts } = await API.get('/api/posts?' + qs.toString());
        renderHomeFeed(posts);
      } catch (err) {
        feedEl.innerHTML = '';
        emptyEl.textContent = 'Could not load posts. Make sure the backend server is running.';
        emptyEl.classList.remove('hidden');
      }
    }

    function segmentInfo(key) {
      return SEGMENTS.find((s) => s.key === key) || { icon: '📋', name: key };
    }

    function renderHomeFeed(posts) {
      const feedEl  = document.getElementById('homeFeed');
      const emptyEl = document.getElementById('homeFeedEmpty');
      if (!posts || !posts.length) {
        feedEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      feedEl.innerHTML = posts.map((p) => {
        const seg = segmentInfo(p.segment);
        const rawImg = (p.images && p.images[0] && p.images[0].url) || '';
        const img = resolveImgUrl(rawImg);
        const thumb = img
          ? `<div class="thumb" style="background-image:url('${esc(img)}')">
               <span class="thumb-badge">${seg.icon} ${esc(seg.name)}</span>
             </div>`
          : `<div class="thumb">
               ${seg.icon}
               <span class="thumb-badge">${esc(seg.name)}</span>
             </div>`;
        const price = p.price != null
          ? fmtBDT(p.price) + (p.priceNote ? ' · ' + esc(p.priceNote) : '')
          : 'Negotiable';
        const ptLabel = (() => {
          const segCfg = SEGMENTS.find(s => s.key === p.segment);
          if (!segCfg) return p.postType;
          const pt = segCfg.postTypes.find(t => t.key === p.postType);
          return pt ? pt.label : p.postType;
        })();
        const authorAvatar = resolveImgUrl(p.author?.avatarUrl);

        return `<article class="post-card">
          ${thumb}
          <div class="body">
            <h3><a href="post.html?id=${p._id}">${esc(p.title)}</a></h3>
            <div class="meta">
              <span class="badge badge-${esc(p.postType)}">${esc(ptLabel)}</span>
              ${p.category ? `<span class="badge">${esc(p.category)}</span>` : ''}
              ${p.isRuetOnly ? '<span class="ruet-tag">RUET only</span>' : ''}
            </div>
            <div class="meta" style="margin-top:2px;">
              by <a href="profile.html?id=${p.author?._id}" style="font-weight:600; color:var(--text2);">${esc(p.author?.name || 'User')}</a>
              ${p.author?.isRuetVerified ? ' <span class="ruet-tag ruet-badge-sm">RUET</span>' : ''}
              · <span>${timeAgo(p.createdAt)}</span>
            </div>
            <div class="price-row">
              <div class="price">${price}</div>
              <a href="post.html?id=${p._id}" class="btn btn-sm" style="padding:4px 10px; font-size:12px;">View</a>
            </div>
          </div>
        </article>`;
      }).join('');
    }

    loadHomeFeed();
  </script>
</body>
</html>
