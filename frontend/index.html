<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shohoj — student services marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="nav"></nav>

  <div class="hero">
    <h1>The student services marketplace</h1>
    <p>
      Tuition, tech repair, design gigs, campus errands, buy &amp; sell — all in one place.
      Sign up with your RUET email to get a <span class="ruet-tag">RUET</span> verified tag.
    </p>
    <div class="flex gap-3" style="justify-content:center;">
      <a href="signup.html" class="btn btn-primary">Get started</a>
      <a href="dashboard.html" class="btn">Browse</a>
    </div>
  </div>

  <div class="container">
    <div class="segment-grid" id="segments"></div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderNavbar();
    const grid = document.getElementById('segments');
    grid.innerHTML = SEGMENTS.map(
      (s) => `
      <a class="segment-card" href="feed.html?segment=${s.key}">
        <span class="icon">${s.icon}</span>
        <h3>${esc(s.name)}</h3>
        <p>${esc(s.tagline)}</p>
      </a>`
    ).join('');
  </script>
</body>
</html>
