# Base44 dev environment for Shohoj.
# Single-origin wiring: nginx (port 3000) serves the static frontend and proxies
# /api and /uploads to the Express backend; MongoDB runs locally in compose.
services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: shohoj
      MONGO_INITDB_ROOT_PASSWORD: shohojpass
      MONGO_INITDB_DATABASE: shohoj
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: node:22
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      PORT: "5000"
      MONGODB_URI: "mongodb://shohoj:shohojpass@mongo:27017/shohoj?authSource=admin"
      JWT_SECRET: "base44-dev-jwt-secret-9f3a7c2e1b8d"
      JWT_EXPIRES_IN: "30d"
      # Same-origin from the browser's view (nginx proxies /api to the backend),
      # but the browser still sends an Origin header on POSTs, so allow it.
      CORS_ORIGIN: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
      RUET_EMAIL_DOMAINS: "student.ruet.ac.bd,ruet.ac.bd"
      PAYMENT_BKASH_NUMBER: "017XXXXXXXX"
      PAYMENT_NAGAD_NUMBER: "017XXXXXXXX"
      PAYMENT_INSTRUCTIONS: "Open bKash/Nagad app → Send Money → paste the number → enter amount → note the Transaction ID and submit it here."
    depends_on:
      mongo:
        condition: service_healthy
    # Install deps (cached in the named volume), then run nodemon with polling
    # so backend edits hot-reload reliably through the bind mount.
    command: sh -c "npm install && npm install --no-save nodemon@3 && node_modules/.bin/nodemon --legacy-watch server.js"
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  backend_node_modules:
